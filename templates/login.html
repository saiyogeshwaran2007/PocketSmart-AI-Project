<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">

  <!-- Simple Header -->
  <nav class="navbar" style="background: transparent; box-shadow: none; padding-top: 1.5rem;">
    <a href="/" class="nav-brand" style="color: #0f172a;">
      <i class="fa-solid fa-wallet" style="color: #2563eb;"></i> Pocket<span class="logo-highlight" style="color: #0284c7;">Smart</span>
    </a>
  </nav>

  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-logo-title">
        Pocket<span>Smart</span>
      </div>
      <div class="auth-subtitle">AI-Powered Budget Planning</div>

      <h2>Welcome Back</h2>

      <div id="alertBox" class="alert-box"></div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" value="sai" required autofocus>
          </div>
        </div>

        <div class="form-group" style="margin-top: 1.25rem;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label for="password" style="margin: 0;">Password</label>
            <a href="#" style="font-size: 0.8rem; color: #64748b; text-decoration: none;">Forgot Password?</a>
          </div>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" value="password123" required>
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit-action" style="margin-top: 1.75rem;">
          <span id="btnText">Sign In <i class="fa-solid fa-arrow-right"></i></span>
        </button>
      </form>

      <div class="auth-switch-text">
        Don't have an account? <a href="/register">Create Account</a>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'alert-box';
      alertBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showAlert('Please provide both username and password.', 'error');
        return;
      }

      btnSubmit.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Signing in...';

      try {
        const formData = new URLSearchParams();
        formData.append('username', username);
        formData.append('password', password);

        const response = await fetch('/token', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: formData.toString()
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 600);
        } else {
          showAlert(data.detail || 'Invalid username or password.', 'error');
          btnSubmit.disabled = false;
          btnText.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right"></i>';
        }
      } catch (err) {
        showAlert('Network error. Please try again.', 'error');
        btnSubmit.disabled = false;
        btnText.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right"></i>';
      }
    });

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = `alert-box ${type}`;
      alertBox.style.display = 'block';
    }
  </script>

</body>
</html>
