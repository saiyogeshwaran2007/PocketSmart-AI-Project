<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account - PocketSmart AI</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">

  <!-- Simple Header -->
  <nav class="navbar" style="background: transparent; box-shadow: none; padding-top: 1.5rem;">
    <a href="/" class="nav-brand" style="color: #0f172a;">
      <i class="fa-solid fa-wallet" style="color: #2563eb;"></i> Pocket<span class="logo-highlight" style="color: #0284c7;">Smart</span>
    </a>
  </nav>

  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-logo-title">
        Pocket<span>Smart</span>
      </div>
      <div class="auth-subtitle">AI-Powered Budget Planning</div>

      <h2>Create Your Account</h2>

      <div id="alertBox" class="alert-box"></div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required autofocus>
          </div>
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label for="email">Email</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
          </div>
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required minlength="6">
          </div>
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label for="confirmPassword">Confirm Password</label>
          <div class="input-with-icon">
            <i class="fa-solid fa-check-circle"></i>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm your password" required minlength="6">
          </div>
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit-action" style="margin-top: 1.75rem;">
          <span id="btnText">Create Account <i class="fa-solid fa-user-plus"></i></span>
        </button>
      </form>

      <div class="auth-switch-text">
        Already have an account? <a href="/login">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnText = document.getElementById('btnText');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.className = 'alert-box';
      alertBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showAlert('Passwords do not match.', 'error');
        return;
      }

      btnSubmit.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span> Creating account...';

      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            username: username,
            email: email,
            password: password
          })
        });

        const data = await response.json();

        if (response.ok) {
          showAlert('Account created successfully! Redirecting to dashboard...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 800);
        } else {
          showAlert(data.detail || 'Registration failed. Please try again.', 'error');
          btnSubmit.disabled = false;
          btnText.innerHTML = 'Create Account <i class="fa-solid fa-user-plus"></i>';
        }
      } catch (err) {
        showAlert('Network error. Please try again.', 'error');
        btnSubmit.disabled = false;
        btnText.innerHTML = 'Create Account <i class="fa-solid fa-user-plus"></i>';
      }
    });

    function showAlert(msg, type) {
      alertBox.textContent = msg;
      alertBox.className = `alert-box ${type}`;
      alertBox.style.display = 'block';
    }
  </script>

</body>
</html>
